# CI — lint + typecheck on every PR (and on pushes to the protected
# branches so direct-push breakage surfaces too).
#
# Toolchain: bun (the same runtime used locally; the repo deliberately
# tracks no lockfile — see .gitignore — so installs resolve from
# package.json). No build job: `next build` needs MongoDB-free env vars
# only, but lint+typecheck covers the regression classes this repo
# cares about (parse errors, type errors, hook-order violations) at a
# fraction of the runner time. Add `bun run build` as a separate job
# before merging anything that touches next.config or the app router
# shell.

name: CI

on:
  pull_request:
    branches: [main, main-full-dev]
  push:
    branches: [main, main-full-dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck:
    name: Lint + Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Lint (eslint, errors fail the build)
        run: bun run lint

      - name: Typecheck (tsc --noEmit)
        run: bun run typecheck
