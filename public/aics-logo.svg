<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#287CBB"/>
      <stop offset="100%" stop-color="#153357"/>
    </linearGradient>
  </defs>
  <!-- Shield outline -->
  <path d="M100 14 L178 42 L178 110 Q178 158 100 186 Q22 158 22 110 L22 42 Z"
        fill="url(#shieldGrad)" stroke="#153357" stroke-width="2"/>
  <!-- Inner shield highlight -->
  <path d="M100 24 L168 48 L168 108 Q168 150 100 174 Q32 150 32 108 L32 48 Z"
        fill="none" stroke="#64BFE9" stroke-width="1.2" opacity="0.55"/>
  <!-- Open book -->
  <g transform="translate(100 110)">
    <!-- Left page -->
    <path d="M-44 -22 Q-22 -32 -2 -22 L-2 22 Q-22 12 -44 22 Z"
          fill="#FFFFFF"/>
    <!-- Right page -->
    <path d="M44 -22 Q22 -32 2 -22 L2 22 Q22 12 44 22 Z"
          fill="#FFFFFF"/>
    <!-- Spine -->
    <line x1="0" y1="-24" x2="0" y2="22" stroke="#287CBB" stroke-width="1.5"/>
    <!-- Left text lines -->
    <line x1="-36" y1="-10" x2="-10" y2="-14" stroke="#4EA4D7" stroke-width="2" stroke-linecap="round"/>
    <line x1="-36" y1="-2" x2="-10" y2="-6" stroke="#4EA4D7" stroke-width="2" stroke-linecap="round"/>
    <line x1="-36" y1="6" x2="-10" y2="2" stroke="#4EA4D7" stroke-width="2" stroke-linecap="round"/>
    <line x1="-36" y1="14" x2="-22" y2="11" stroke="#4EA4D7" stroke-width="2" stroke-linecap="round"/>
    <!-- Right text lines -->
    <line x1="10" y1="-14" x2="36" y2="-10" stroke="#4EA4D7" stroke-width="2" stroke-linecap="round"/>
    <line x1="10" y1="-6" x2="36" y2="-2" stroke="#4EA4D7" stroke-width="2" stroke-linecap="round"/>
    <line x1="10" y1="2" x2="36" y2="6" stroke="#4EA4D7" stroke-width="2" stroke-linecap="round"/>
    <line x1="22" y1="11" x2="36" y2="14" stroke="#4EA4D7" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- AICS monogram top -->
  <text x="100" y="68" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="800"
        fill="#FFFFFF" letter-spacing="2">AICS</text>
</svg>
