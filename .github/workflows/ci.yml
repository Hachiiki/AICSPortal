name: CI

on:
  pull_request:
    branches:
      - main
      - main-full-dev
  push:
    branches:
      - main
      - main-full-dev

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck:
    name: Lint, typecheck, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint (eslint, errors fail the build)
        run: npm run lint

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Build production application
        run: npm run build

      - name: Audit locked dependencies
        run: npm audit --audit-level=high

  authz-unit:
    name: Authorization unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Set up Bun test runner
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.5'

      - name: Authorization and security unit tests
        run: bun test src/lib/authz/ src/lib/request-security.test.ts src/lib/password.test.ts src/lib/raw-upload.test.ts

  whitelist:
    name: Production whitelist guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main')
      || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail if any tracked file is outside the production whitelist
        run: |
          pattern='^(\.github/.*|\.vscode/.*|public/.*|src/.*|\.gitignore|CONTRIBUTING\.md|Caddyfile|LICENSE|README\.md|components\.json|eslint\.config\.mjs|example\.env\.local|next-env\.d\.ts|next\.config\.ts|package\.json|package-lock\.json|postcss\.config\.mjs|tailwind\.config\.ts|tsconfig\.json|vercel\.json)$'
          env_files=$(git ls-tree -r --name-only HEAD | grep -E '(^|/)(\.env([^/]*|$)|[^/]*\.env(\.[^/]*)?)$' | grep -Ev '^(example\.env\.local|\.env\.example)$' || true)
          if [ -n "$env_files" ]; then
            echo "FAIL: tracked environment file:"
            echo "$env_files"
            exit 1
          fi
          bad=$(git ls-tree -r --name-only HEAD | grep -Ev "$pattern" || true)
          if [ -n "$bad" ]; then
            echo "FAIL: files outside the production whitelist:"
            echo "$bad"
            echo ""
            echo "main carries production files only. These files belong on"
            echo "main-full-dev. Cut production PRs from main-based branches,"
            echo "never from main-full-dev."
            exit 1
          fi
          echo "PASS: $(git ls-tree -r --name-only HEAD | wc -l) tracked files, all inside the whitelist."
