# CI — lint + typecheck on every PR (and on pushes to the protected
# branches so direct-push breakage surfaces too), plus a production
# whitelist guard that keeps dev-only files out of main.
#
# Toolchain: bun (the same runtime used locally; the repo deliberately
# tracks no lockfile — see .gitignore — so installs resolve from
# package.json). No build job: lint+typecheck covers the regression
# classes this repo cares about (parse errors, type errors, hook-order
# violations) at a fraction of the runner time. Add `bun run build` as
# a separate job before merging anything that touches next.config or
# the app router shell.
#
# The whitelist guard inspects the FULL tree a PR into main would put
# on main — not just the diff — so it also catches branches cut from
# an old main that still carried dev files (how the original leak
# happened). It only runs when the target is main; PRs into
# main-full-dev legitimately touch dev files and are exempt.

name: CI

on:
  pull_request:
    branches:
      - main
      - main-full-dev
  push:
    branches:
      - main
      - main-full-dev

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck:
    name: Lint + Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Lint (eslint, errors fail the build)
        run: bun run lint

      - name: Typecheck (tsc --noEmit)
        run: bun run typecheck

  whitelist:
    name: Production whitelist guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main')
      || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail if any tracked file is outside the production whitelist
        run: |
          pattern='^(\.github/.*|\.vscode/.*|public/.*|src/.*|\.gitignore|CONTRIBUTING\.md|Caddyfile|LICENSE|README\.md|components\.json|eslint\.config\.mjs|example\.env\.local|next-env\.d\.ts|next\.config\.ts|package\.json|postcss\.config\.mjs|tailwind\.config\.ts|tsconfig\.json|vercel\.json)$'
          bad=$(git ls-tree -r --name-only HEAD | grep -Ev "$pattern" || true)
          if [ -n "$bad" ]; then
            echo "FAIL: files outside the production whitelist:"
            echo "$bad"
            echo ""
            echo "main carries production files only. These files belong on"
            echo "main-full-dev. Cut production PRs from main-based branches,"
            echo "never from main-full-dev."
            exit 1
          fi
          echo "PASS: $(git ls-tree -r --name-only HEAD | wc -l) tracked files, all inside the whitelist."
